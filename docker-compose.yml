services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: llm_trading_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d llm_trading_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://lab:lab@postgres:5432/llm_trading_lab
      REDIS_URL: redis://redis:6379/0
      TRADING_MODE: DEMO
    ports:
      - "8808:8808"
    volumes:
      - ./data:/app/data
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed_demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8808 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://lab:lab@postgres:5432/llm_trading_lab
      REDIS_URL: redis://redis:6379/0
      TRADING_MODE: DEMO
    volumes:
      - ./data:/app/data
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m worker.main

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5180:80"
    depends_on:
      - api

volumes:
  pgdata:
