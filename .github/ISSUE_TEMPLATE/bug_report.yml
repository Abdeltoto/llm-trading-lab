name: Bug
description: Comportement incorrect (hors demande de conseil financier)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de ne pas inclure de secrets. LLM Trading Lab = simulation uniquement.
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: TRADING_MODE
      options: ["DEMO", "BACKTEST", "PAPER_FORWARD"]
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
